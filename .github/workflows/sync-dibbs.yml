name: Sync DIBBS

# Imports the newest DIBBS list into the live database three times a day:
# 7:00 AM, 2:00 PM and 11:59 PM Eastern. Cron runs in UTC, so each run is
# listed for both daylight time (EDT, UTC-4) and standard time (EST, UTC-5),
# and the check step skips the one that doesn't match today's offset.
on:
  schedule:
    - cron: "0 11 * * *" # 7:00 AM EDT
    - cron: "0 18 * * *" # 2:00 PM EDT
    - cron: "59 3 * * *" # 11:59 PM EDT
    - cron: "0 12 * * *" # 7:00 AM EST
    - cron: "0 19 * * *" # 2:00 PM EST
    - cron: "59 4 * * *" # 11:59 PM EST
  workflow_dispatch:
    inputs:
      date:
        description: "Issue date (MM-DD-YYYY). Leave blank for the newest list."
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check Eastern offset
        id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          zone=$(TZ=America/New_York date +%Z)
          case "$SCHEDULE" in
            "") run=true ;;
            "0 11 * * *"|"0 18 * * *"|"59 3 * * *") [ "$zone" = EDT ] && run=true || run=false ;;
            *) [ "$zone" = EST ] && run=true || run=false ;;
          esac
          echo "Eastern zone $zone, schedule '$SCHEDULE', run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.check.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.run == 'true'
        with:
          node-version: 22

      - name: Import DIBBS list
        if: steps.check.outputs.run == 'true'
        env:
          ISSUE_DATE: ${{ inputs.date }}
        run: node scripts/sync-dibbs.mjs https://bidprospect.com "$ISSUE_DATE"
